<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAYZ XITER</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: linear-gradient(180deg, rgba(10, 10, 10, 0.72) 0%, rgba(10, 10, 10, 0.65) 50%, rgba(10, 10, 10, 0.78) 100%), url('https://media1.tenor.com/m/m9ipnIinnLIAAAAC/fairy-tail-natsu-dragneel.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Barra superior estilo painel */

        .panel-header {
            max-width: 420px;
            margin: 0 auto 24px;
            background: linear-gradient(180deg, #9D00FF 0%, #9D00FF 100%);
            padding: 14px 20px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(157, 0, 255, 0.15);
            box-shadow: 0 4px 20px rgba(157, 0, 255, 0.4);
        }

        .panel-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .panel-header .close-btn {
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .panel-header .close-btn:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: rgba(18, 18, 18, 0.95);
            border: 1px solid rgba(157, 0, 255, 0.06);
            border-top: none;
            border-radius: 0 0 12px 12px;
            padding: 28px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(157, 0, 255, 0.1);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: #9D00FF;
            letter-spacing: 1px;
            border: 2px solid rgba(157, 0, 255, 0.4);
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.2);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .container>.title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
            color: #fff;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 24px;
            text-align: center;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .link-btn:hover {
            background: rgba(157, 0, 255, 0.2);
            border-color: rgba(157, 0, 255, 0.5);
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.15);
        }

        .link-btn i {
            margin-right: 10px;
        }

        .discord-btn {
            color: #fff;
        }

        .discord-btn i {
            color: #5865f2;
        }

        .store-btn i {
            color: #9D00FF;
        }

        /* Seção referências */

        .refs-section {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .refs-section h2 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #9D00FF;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
            text-align: center;
            text-transform: uppercase;
        }

        .refs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .refs-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #111;
        }

        .refs-grid img:only-child,
        .refs-grid a {
            grid-column: span 2;
        }

        .refs-grid a {
            display: block;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer {
            margin-top: 28px;
            font-size: 0.8rem;
            color: #555;
            text-align: center;
        }

        @media (max-width: 480px) {
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 22px;
            }
            .container>.title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-layer" aria-hidden="true"></div>
    <header class="panel-header">
        <h1>▼ DRAYZ XITER</h1>
        <button type="button" class="close-btn" aria-label="Fechar">×</button>
    </header>

    <div class="container">
        <div class="avatar" title="DRAYZ XITER">D</div>
        <p class="title">DRAYZ XITER</p>
        <p class="subtitle">Junte-se à comunidade ou acesse a loja</p>

        <div class="links">
            <a href="https://discord.gg/PDNF9hDMk2" class="link-btn discord-btn" target="_blank" rel="noopener">
                <i class="fab fa-discord"></i> Entrar no Discord
            </a>
            <a href="https://drayzxiter.sharpify.online" class="link-btn store-btn" target="_blank" rel="noopener">
                <i class="fas fa-store"></i> Loja Sharpify
            </a>
        </div>

        <section class="refs-section" aria-label="Referências">
            <h2>Referências</h2>
            <div class="refs-grid">
                <img src="assets/ref1.png" alt="Referência 1 - DRAYZ XITER" loading="lazy" onerror="this.style.display='none'">
                <img src="assets/ref2.png" alt="Referência 2 - DRAYZ XITER" loading="lazy" onerror="this.style.display='none'">
                <img src="assets/ref3.png" alt="Referência 3 - DRAYZ XITER" loading="lazy" onerror="this.style.display='none'">
                <img src="assets/ref4.png" alt="Referência 4 - DRAYZ XITER" loading="lazy" onerror="this.style.display='none'">
            </div>
        </section>

        <div class="footer">Feito com ❤️ para a comunidade</div>
    </div>
</body>

</html>
